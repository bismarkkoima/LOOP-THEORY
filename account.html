<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Loop Theory — Account</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Ccircle cx='12' cy='15' r='8' fill='none' stroke='%23D2AD74' stroke-width='2.4'/%3E%3Ccircle cx='19' cy='15' r='8' fill='none' stroke='%234C8577' stroke-width='2.4'/%3E%3C/svg%3E">

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="loopmark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <circle cx="12" cy="15" r="8" stroke="var(--brass-bright)" stroke-width="2.4"/>
        <circle cx="19" cy="15" r="8" stroke="var(--verdigris)" stroke-width="2.4"/>
      </svg>
    </span>
    Loop Theory
  </div>
  <div class="header-actions">
    <a class="linkish" href="admin.html">Dashboard</a>
    <a class="linkish" href="index.html">View store</a>
    <span id="themeSlot"></span>
  </div>
</header>

<div id="banners"></div>

<main class="account-wrap" id="main">
  <div class="account-hero">
    <span id="avatarSlot"></span>
    <div>
      <h1 id="displayName">…</h1>
      <div class="email" id="displayEmail"></div>
    </div>
  </div>

  <div class="rows" id="rows"></div>

  <div class="rows">
    <div class="row">
      <span class="k">Appearance</span>
      <span class="v">
        <span class="filters" id="themeChoice" style="justify-content:flex-end;"></span>
      </span>
    </div>
  </div>

  <div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;">
    <button class="btn-ghost" id="signOut">Sign out</button>
  </div>
</main>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/account.js"></script>
</body>
</html>
